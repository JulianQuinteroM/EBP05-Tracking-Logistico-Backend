spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tracking_logistico}
    username: ${DB_USERNAME:tracking}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  error:
    include-message: never
app:
  security:
    operator-username: ${OPERATOR_USERNAME:}
    operator-password: ${OPERATOR_PASSWORD:}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
management:
  endpoints:
    web:
      exposure:
        include: health
