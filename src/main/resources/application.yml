spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tracking_logistico}
    username: ${DB_USERNAME:tracking}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
app:
  ai:
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
  security:
    operator-username: ${OPERATOR_USERNAME:}
    operator-password: ${OPERATOR_PASSWORD:}
    admin-username: ${ADMIN_USERNAME:administrador}
    admin-password: ${ADMIN_PASSWORD:}
    viewer-username: ${VIEWER_USERNAME:consulta}
    viewer-password: ${VIEWER_PASSWORD:}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
management:
  endpoints:
    web:
      exposure:
        include: health
